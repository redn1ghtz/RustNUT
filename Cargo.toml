[package]
name = "rustnut"
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native Windows monitor for Network UPS Tools"

[dependencies]
native-tls = "0.2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus",
    "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_SystemServices",
    "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
